name: SmartSort CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck Frontend (TypeScript)
        run: npm run typecheck

      - name: Build Frontend (Vite)
        env:
          VITE_API_BASE_URL: "http://localhost:5000"
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "example-key"
        run: npm run build

  backend-check:
    name: Backend Syntax & Schema Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartsort-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Syntax Check Backend
        run: npm run check

  ml-service-check:
    name: ML Service Python Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smartsort-ml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check Python App
        run: python -m py_compile app.py
