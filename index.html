
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Smart Sort</title>
      <link rel="icon" type="image/png" href="/logo.png" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; gap: 24px;">
          <img src="/logo.png" alt="SmartSort Logo" style="width: 120px; height: 120px; object-fit: contain; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);" />
          <div style="width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <style>
            @keyframes spin { to { transform: rotate(360deg); } }
          </style>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
